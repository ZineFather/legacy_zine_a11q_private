name: Build ZineROM One UI 7 Boot Port (Galaxy A11)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a115f]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout required build submodules
        run: |
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git submodule update --init --depth=1 --recursive \
              external/android-tools \
              external/apktool \
              external/erofs-utils \
              external/img2sdat \
              external/samloader \
              external/signapk; then
              exit 0
            fi
            echo "Submodule checkout failed (attempt ${attempt}/5); retrying..."
            sleep $((attempt * 20))
          done
          echo "Submodule checkout failed after 5 attempts"
          exit 1

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld jq protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Install pinned Samloader
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/topjohnwu/samloader-rs/releases/download/2.2.0/samloader-v2.2.0-linux-x86_64.zip \
            --output /tmp/samloader.zip
          echo "f6029dcce75b8a66acc1975529085c53903f7cdb35505e0ac0a973f2652480ff  /tmp/samloader.zip" | sha256sum --check --status
          unzip -p /tmp/samloader.zip samloader > /tmp/samloader
          chmod 0755 /tmp/samloader
          sudo install -m 0755 /tmp/samloader /usr/local/bin/samloader
          samloader --version

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download, validate, and extract pinned Samsung firmware
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/import_samfw_firmware.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Verify ZIP
        run: |
          test -s out/ZineROM_OneUI7_a115f-BootPort.zip
          sha256sum out/ZineROM_OneUI7_a115f-BootPort.zip

      - name: Publish public GoFile download
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 10 \
            -F "file=@out/ZineROM_OneUI7_a115f-BootPort.zip;filename=ZineROM_OneUI7_a115f-BootPort.zip" \
            https://upload.gofile.io/uploadfile \
            --output /tmp/gofile-response.json
          URL="$(jq -r '.data.downloadPage // .data.page // empty' /tmp/gofile-response.json)"
          test -n "$URL"
          echo "Public download: $URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ZineROM_OneUI7_a115f-BootPort-${{ github.run_number }}
          path: out/ZineROM_OneUI7_a115f-BootPort.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish test download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zinerom-oneui7-a115f-${GITHUB_RUN_NUMBER}"
          if ! gh release create "$TAG" out/ZineROM_OneUI7_a115f-BootPort.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZineROM One UI 7 Boot Port [a115f]" \
            --notes "Experimental boot-first test build for Samsung Galaxy A11 (SM-A115F). Target boot/vendor/kernel/DTBO: A115F S6 A115FXXS6CWK2. Donor system: Qualcomm Galaxy A05s One UI 7 A057FXXUFDZH2. Not confirmed to boot and not intended for any other model. Keep stock firmware and Download Mode access available." \
            --prerelease; then
            echo "::warning::Release creation failed; the ZIP artifact uploaded above remains available in this workflow run."
          fi
