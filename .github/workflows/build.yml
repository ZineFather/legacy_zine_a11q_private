name: Build ZineROM One UI 7 (Galaxy A52s 5G)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout required build submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --depth=1 --recursive \
            external/android-tools \
            external/apktool \
            external/erofs-utils \
            external/img2sdat \
            external/samloader \
            external/signapk

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld jq protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download and validate pinned firmware archives
        env:
          SOURCE_FIRMWARE_URL: ${{ secrets.SAMFW_SOURCE_URL }}
          TARGET_FIRMWARE_URL: ${{ secrets.SAMFW_TARGET_URL }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/import_samfw_firmware.sh

      - name: Extract source firmware
        env:
          SAMFW_PINNED_FIRMWARES: |
            SM-S911B/BTB=S911BXXS8DYI3/S911BOXM8DYI3/CP31479988
            SM-A528B/BTU=A528BXXSBGYI3/A528BOXMBGYI3/CP31566566
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target

      - name: Extract target firmware
        env:
          SAMFW_PINNED_FIRMWARES: |
            SM-S911B/BTB=S911BXXS8DYI3/S911BOXM8DYI3/CP31479988
            SM-A528B/BTU=A528BXXSBGYI3/A528BOXMBGYI3/CP31566566
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Verify ZIP
        run: |
          test -s out/ZineROM_OneUI7_a52xq.zip
          sha256sum out/ZineROM_OneUI7_a52xq.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZineROM_OneUI7_a52xq-${{ github.run_number }}
          path: out/ZineROM_OneUI7_a52xq.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish test download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="zinerom-oneui7-a52sxq-${GITHUB_RUN_NUMBER}"
          if ! gh release create "$TAG" out/ZineROM_OneUI7_a52xq.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZineROM Project stable [a52sxq]" \
            --notes "Experimental test build for Samsung Galaxy A52s 5G (SM-A528B, codename a52sxq). It keeps the upstream S23 One UI 7 QSSI source base; the A73 base was not changed. This has not been tested on physical hardware and is not confirmed to boot. Do not flash on other models. Keep a tested stock firmware package and recovery/Download Mode access available." \
            --prerelease; then
            echo "::warning::Release creation failed; the ZIP artifact uploaded above remains available in this workflow run."
          fi
